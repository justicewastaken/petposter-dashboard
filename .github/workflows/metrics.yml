name: Fetch Metrics

on:
  schedule:
    - cron: "0 10 * * 1"   # Every Monday 10:00 UTC (5am CDT)
  workflow_dispatch:         # Run anytime from GitHub UI

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests

      - name: Fetch metrics
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
        run: python scripts/fetch_metrics.py

      - name: Commit updated data
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/data.json
          git diff --staged --quiet || git commit -m "chore: update metrics $(date -u +%Y-%m-%d) [skip ci]"
          git push

      - name: Notify on failure
        if: failure()
        run: |
          curl -s -d "Dashboard metrics fetch failed — check GitHub Actions logs" \
            -H "Title: ❌ PetPoster Dashboard FAILED" \
            -H "Priority: high" \
            https://ntfy.sh/petposter-justice
