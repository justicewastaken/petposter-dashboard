<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PetPoster Dashboard</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
  :root {
    --bg:       #0f1117;
    --surface:  #1a1d27;
    --border:   #2a2d3e;
    --text:     #e2e8f0;
    --muted:    #64748b;
    --accent:   #6366f1;
    --green:    #22c55e;
    --orange:   #f97316;
    --pink:     #ec4899;
    --yellow:   #eab308;
    --blue:     #3b82f6;
    --purple:   #a855f7;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; min-height: 100vh; }

  /* ── Layout ── */
  .header { background: var(--surface); border-bottom: 1px solid var(--border); padding: 20px 32px; display: flex; align-items: center; justify-content: space-between; }
  .header h1 { font-size: 20px; font-weight: 700; letter-spacing: -0.3px; }
  .header h1 span { color: var(--accent); }
  .header-meta { font-size: 12px; color: var(--muted); }
  .refresh-btn { background: var(--accent); color: #fff; border: none; padding: 8px 16px; border-radius: 8px; font-size: 13px; cursor: pointer; font-weight: 600; }
  .refresh-btn:hover { opacity: 0.85; }

  .main { max-width: 1400px; margin: 0 auto; padding: 32px; }

  /* ── Account tabs ── */
  .tabs { display: flex; gap: 8px; margin-bottom: 28px; flex-wrap: wrap; }
  .tab { padding: 8px 18px; border-radius: 8px; border: 1px solid var(--border); background: var(--surface); color: var(--muted); font-size: 13px; font-weight: 600; cursor: pointer; transition: all .15s; }
  .tab.active, .tab:hover { border-color: var(--accent); color: var(--text); }
  .tab.active { background: var(--accent); color: #fff; border-color: var(--accent); }

  /* ── Account panel ── */
  .panel { display: none; }
  .panel.active { display: block; }

  /* ── Account header ── */
  .acct-header { display: flex; align-items: center; gap: 20px; background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 24px 28px; margin-bottom: 24px; }
  .acct-avatar { width: 64px; height: 64px; border-radius: 50%; object-fit: cover; background: var(--border); flex-shrink: 0; }
  .acct-avatar-placeholder { width: 64px; height: 64px; border-radius: 50%; background: linear-gradient(135deg, var(--accent), var(--pink)); display: flex; align-items: center; justify-content: center; font-size: 24px; flex-shrink: 0; }
  .acct-info h2 { font-size: 20px; font-weight: 700; }
  .acct-info .handle { color: var(--muted); font-size: 14px; margin-top: 2px; }
  .acct-info .bio { color: var(--muted); font-size: 13px; margin-top: 6px; max-width: 500px; }
  .acct-stats { display: flex; gap: 32px; margin-left: auto; text-align: center; }
  .acct-stat-val { font-size: 22px; font-weight: 700; }
  .acct-stat-label { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.5px; margin-top: 2px; }

  /* ── Metric cards ── */
  .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 16px; margin-bottom: 28px; }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 20px; }
  .card-label { font-size: 11px; text-transform: uppercase; letter-spacing: 0.6px; color: var(--muted); margin-bottom: 10px; }
  .card-value { font-size: 28px; font-weight: 700; line-height: 1; }
  .card-sub { font-size: 12px; color: var(--muted); margin-top: 6px; }
  .card.green .card-value { color: var(--green); }
  .card.blue .card-value { color: var(--blue); }
  .card.orange .card-value { color: var(--orange); }
  .card.pink .card-value { color: var(--pink); }
  .card.purple .card-value { color: var(--purple); }
  .card.yellow .card-value { color: var(--yellow); }

  /* ── Charts row ── */
  .charts-row { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 20px; }
  .chart-box { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 20px; }
  .chart-box h3 { font-size: 14px; font-weight: 600; margin-bottom: 16px; color: var(--muted); }
  .chart-box canvas { max-height: 220px; }
  @media (max-width: 800px) { .charts-row { grid-template-columns: 1fr; } }

  /* ── Daily insights chart (full width) ── */
  .chart-box-full { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 20px; margin-bottom: 28px; }
  .chart-box-full h3 { font-size: 14px; font-weight: 600; margin-bottom: 4px; color: var(--muted); }
  .chart-box-full .chart-subtitle { font-size: 12px; color: var(--muted); opacity: 0.6; margin-bottom: 16px; }
  .chart-box-full canvas { max-height: 260px; }

  /* ── Posts table ── */
  .posts-section h3 { font-size: 15px; font-weight: 700; margin-bottom: 16px; }
  .posts-grid { display: grid; gap: 12px; }
  .post-row { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 16px 20px; display: grid; grid-template-columns: auto 1fr repeat(6, auto); gap: 12px 20px; align-items: center; }
  .post-thumb-wrap { width: 52px; height: 52px; border-radius: 8px; overflow: hidden; background: var(--border); flex-shrink: 0; }
  .post-thumb-wrap img { width: 100%; height: 100%; object-fit: cover; }
  .post-caption { font-size: 13px; color: var(--muted); line-height: 1.4; max-width: 300px; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
  .post-date { font-size: 11px; color: var(--muted); white-space: nowrap; }
  .metric-cell { text-align: right; }
  .metric-cell .val { font-size: 15px; font-weight: 700; }
  .metric-cell .lbl { font-size: 10px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.4px; }
  .post-link { color: var(--accent); font-size: 12px; text-decoration: none; white-space: nowrap; }
  .post-link:hover { text-decoration: underline; }

  /* ── Overview tab ── */
  .overview-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 20px; margin-bottom: 28px; }
  .overview-card { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 20px; }
  .overview-card .oc-header { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; }
  .oc-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
  .oc-name { font-size: 15px; font-weight: 700; }
  .oc-handle { font-size: 12px; color: var(--muted); }
  .oc-metrics { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .oc-metric { }
  .oc-metric .val { font-size: 18px; font-weight: 700; }
  .oc-metric .lbl { font-size: 11px; color: var(--muted); }

  /* ── Loading / Error ── */
  .loading { text-align: center; padding: 80px; color: var(--muted); font-size: 15px; }
  .error-box { background: #1f1010; border: 1px solid #7f2020; border-radius: 12px; padding: 20px; color: #f87171; font-size: 14px; }

  /* ── Comparison chart ── */
  .compare-box { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 24px; margin-bottom: 28px; }
  .compare-box h3 { font-size: 14px; font-weight: 600; margin-bottom: 20px; color: var(--muted); }
  .compare-box canvas { max-height: 300px; }

  /* ── Responsive ── */
  @media (max-width: 900px) {
    .post-row { grid-template-columns: auto 1fr; }
    .metric-cell:not(:first-of-type) { display: none; }
    .acct-stats { display: none; }
    .main { padding: 16px; }
  }
</style>
</head>
<body>

<div class="header">
  <h1>🐾 <span>PetPoster</span> Dashboard</h1>
  <div style="display:flex;align-items:center;gap:16px">
    <span class="header-meta" id="last-updated">Loading…</span>
    <button class="refresh-btn" onclick="location.reload()">↻ Refresh</button>
  </div>
</div>

<div class="main">
  <div id="root"><div class="loading">Loading metrics…</div></div>
</div>

<script>
// ── Color palette per account ─────────────────────────────────────────────────
const COLORS = ['#6366f1','#22c55e','#f97316','#ec4899'];
const ACCOUNT_EMOJIS = { mochis: '🐱', frankies: '🐕', bobas: '🐶', sunnys: '☀️' };

// ── Number formatting ─────────────────────────────────────────────────────────
function fmt(n) {
  if (n == null || n === '') return '—';
  n = Number(n);
  if (isNaN(n)) return '—';
  if (n >= 1000000) return (n / 1000000).toFixed(1) + 'M';
  if (n >= 10000)  return (n / 1000).toFixed(1) + 'K';
  if (n >= 1000)   return (n / 1000).toFixed(1) + 'K';
  return n.toLocaleString();
}
function fmtDate(iso) {
  if (!iso) return '';
  const d = new Date(iso);
  return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
}

// ── Chart defaults ────────────────────────────────────────────────────────────
Chart.defaults.color = '#64748b';
Chart.defaults.borderColor = '#2a2d3e';
Chart.defaults.font.family = "-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif";

const charts = {};
function destroyChart(id) { if (charts[id]) { charts[id].destroy(); delete charts[id]; } }

// ── Render Overview tab ───────────────────────────────────────────────────────
function renderOverview(accounts) {
  let html = `<div class="overview-grid">`;
  accounts.forEach((a, i) => {
    const w = a.weekly || {};
    const color = COLORS[i % COLORS.length];
    const emoji = ACCOUNT_EMOJIS[a.slug] || '🐾';
    html += `
      <div class="overview-card">
        <div class="oc-header">
          <div class="oc-dot" style="background:${color}"></div>
          <div>
            <div class="oc-name">${emoji} ${a.display}</div>
            <div class="oc-handle">@${a.username}</div>
          </div>
          <div style="margin-left:auto;text-align:right">
            <div style="font-size:20px;font-weight:700;color:${color}">${fmt(a.followers)}</div>
            <div style="font-size:11px;color:var(--muted)">followers</div>
          </div>
        </div>
        <div class="oc-metrics">
          <div class="oc-metric"><div class="val" style="color:var(--blue)">${fmt(w.reach)}</div><div class="lbl">Wkly Reach</div></div>
          <div class="oc-metric"><div class="val" style="color:var(--green)">${fmt(w.impressions)}</div><div class="lbl">Impressions</div></div>
          <div class="oc-metric"><div class="val" style="color:var(--orange)">${fmt(w.profile_views)}</div><div class="lbl">Profile Views</div></div>
          <div class="oc-metric"><div class="val" style="color:var(--pink)">${fmt(w.website_clicks)}</div><div class="lbl">Bio Link Clicks</div></div>
        </div>
      </div>`;
  });
  html += `</div>`;

  // Comparison bar chart
  html += `<div class="compare-box">
    <h3>Weekly Reach — All Accounts</h3>
    <canvas id="chart-compare"></canvas>
  </div>`;

  // Top posts across all accounts
  const allPosts = [];
  accounts.forEach((a, i) => {
    (a.posts || []).forEach(p => {
      allPosts.push({ ...p, _account: a.username, _color: COLORS[i] });
    });
  });
  allPosts.sort((x, y) => ((y.insights?.plays || y.insights?.reach || 0) - (x.insights?.plays || x.insights?.reach || 0)));
  const top = allPosts.slice(0, 10);

  html += `<div class="posts-section">
    <h3>Top 10 Posts Across All Accounts</h3>
    <div class="posts-grid">`;
  top.forEach(p => {
    html += renderPostRow(p, true);
  });
  html += `</div></div>`;

  return html;
}

// ── Render individual account panel ──────────────────────────────────────────
function renderAccount(a, idx) {
  const w = a.weekly || {};
  const color = COLORS[idx % COLORS.length];
  const emoji = ACCOUNT_EMOJIS[a.slug] || '🐾';

  // Header
  const avatarHtml = a.profile_pic
    ? `<img class="acct-avatar" src="${a.profile_pic}" onerror="this.style.display='none'" alt="">`
    : `<div class="acct-avatar-placeholder">${emoji}</div>`;

  let html = `
    <div class="acct-header">
      ${avatarHtml}
      <div class="acct-info">
        <h2>${a.display}</h2>
        <div class="handle">@${a.username}</div>
        ${a.bio ? `<div class="bio">${a.bio}</div>` : ''}
      </div>
      <div class="acct-stats">
        <div><div class="acct-stat-val" style="color:${color}">${fmt(a.followers)}</div><div class="acct-stat-label">Followers</div></div>
        <div><div class="acct-stat-val">${fmt(a.follows)}</div><div class="acct-stat-label">Following</div></div>
        <div><div class="acct-stat-val">${fmt(a.media_count)}</div><div class="acct-stat-label">Posts</div></div>
      </div>
    </div>`;

  // Metric cards
  html += `<div class="cards">
    <div class="card blue"><div class="card-label">Weekly Reach</div><div class="card-value">${fmt(w.reach)}</div><div class="card-sub">unique accounts</div></div>
    <div class="card green"><div class="card-label">Impressions</div><div class="card-value">${fmt(w.impressions)}</div><div class="card-sub">total this week</div></div>
    <div class="card orange"><div class="card-label">Profile Views</div><div class="card-value">${fmt(w.profile_views)}</div><div class="card-sub">this week</div></div>
    <div class="card pink"><div class="card-label">Bio Link Clicks</div><div class="card-value">${fmt(w.website_clicks)}</div><div class="card-sub">this week</div></div>
    <div class="card purple"><div class="card-label">Followers</div><div class="card-value">${fmt(a.followers)}</div><div class="card-sub">total</div></div>
  </div>`;

  // Top 2 charts row
  html += `<div class="charts-row">
    <div class="chart-box"><h3>Follower Growth (28 days)</h3><canvas id="chart-${a.slug}-followers"></canvas></div>
    <div class="chart-box"><h3>Post Performance (plays / reach)</h3><canvas id="chart-${a.slug}-posts"></canvas></div>
  </div>`;

  // Daily views + profile visits (full-width)
  html += `<div class="chart-box-full">
    <h3>Daily Views &amp; Profile Visits (28 days)</h3>
    <div class="chart-subtitle">Hover to see exact numbers — spot spikes when posts go viral</div>
    <canvas id="chart-${a.slug}-daily"></canvas>
  </div>`;

  // Posts
  const posts = (a.posts || []).slice(0, 14);
  html += `<div class="posts-section">
    <h3>Recent Posts</h3>
    <div class="posts-grid">`;
  posts.forEach(p => { html += renderPostRow(p, false); });
  html += `</div></div>`;

  return html;
}

function renderPostRow(p, showAccount) {
  const ins = p.insights || {};
  const plays = ins.plays ?? ins.reach ?? 0;
  const views = fmt(plays);
  const likes = fmt(ins.likes ?? p.like_count ?? 0);
  const comments = fmt(ins.comments ?? p.comment_count ?? 0);
  const saves = fmt(ins.saved ?? 0);
  const shares = fmt(ins.shares ?? 0);
  const reach = fmt(ins.reach ?? 0);

  const thumb = p.thumbnail || '';
  const thumbHtml = thumb
    ? `<img src="${thumb}" alt="" onerror="this.parentElement.innerHTML='🎬'" loading="lazy">`
    : `<div style="display:flex;align-items:center;justify-content:center;height:100%;color:var(--muted);font-size:20px">🎬</div>`;

  const caption = (p.caption || '(no caption)').slice(0, 100);
  const accountTag = showAccount ? `<span style="font-size:11px;color:${p._color || 'var(--accent)'};font-weight:600">@${p._account}</span><br>` : '';

  return `
    <div class="post-row">
      <div class="post-thumb-wrap">${thumbHtml}</div>
      <div>
        ${accountTag}
        <div class="post-caption">${caption}</div>
        <div class="post-date">${fmtDate(p.timestamp)}</div>
      </div>
      <div class="metric-cell"><div class="val" style="color:var(--blue)">${views}</div><div class="lbl">Plays</div></div>
      <div class="metric-cell"><div class="val" style="color:var(--green)">${reach}</div><div class="lbl">Reach</div></div>
      <div class="metric-cell"><div class="val" style="color:var(--pink)">${likes}</div><div class="lbl">Likes</div></div>
      <div class="metric-cell"><div class="val" style="color:var(--orange)">${comments}</div><div class="lbl">Comments</div></div>
      <div class="metric-cell"><div class="val" style="color:var(--purple)">${saves}</div><div class="lbl">Saves</div></div>
      <div class="metric-cell"><div class="val" style="color:var(--yellow)">${shares}</div><div class="lbl">Shares</div></div>
      ${p.permalink ? `<a class="post-link" href="${p.permalink}" target="_blank">View ↗</a>` : ''}
    </div>`;
}

// ── Draw charts (after DOM insertion) ────────────────────────────────────────
function drawCharts(accounts) {
  // Overview comparison chart
  const cmpEl = document.getElementById('chart-compare');
  if (cmpEl) {
    destroyChart('compare');
    charts['compare'] = new Chart(cmpEl, {
      type: 'bar',
      data: {
        labels: accounts.map(a => `@${a.username}`),
        datasets: [
          {
            label: 'Weekly Reach',
            data: accounts.map(a => a.weekly?.reach || 0),
            backgroundColor: COLORS.slice(0, accounts.length),
            borderRadius: 6,
          },
          {
            label: 'Weekly Impressions',
            data: accounts.map(a => a.weekly?.impressions || 0),
            backgroundColor: COLORS.slice(0, accounts.length).map(c => c + '55'),
            borderRadius: 6,
          },
        ],
      },
      options: {
        responsive: true, maintainAspectRatio: true,
        plugins: { legend: { labels: { boxWidth: 12 } } },
        scales: { y: { beginAtZero: true, ticks: { callback: v => fmt(v) } } },
      },
    });
  }

  // Per-account charts
  accounts.forEach((a, idx) => {
    const color = COLORS[idx % COLORS.length];

    // Follower history sparkline
    const fEl = document.getElementById(`chart-${a.slug}-followers`);
    if (fEl && a.follower_history?.length) {
      destroyChart(`${a.slug}-followers`);
      const hist = a.follower_history;
      charts[`${a.slug}-followers`] = new Chart(fEl, {
        type: 'line',
        data: {
          labels: hist.map(h => h.date),
          datasets: [{
            label: 'Followers',
            data: hist.map(h => h.value),
            borderColor: color,
            backgroundColor: color + '22',
            fill: true,
            tension: 0.4,
            pointRadius: 0,
          }],
        },
        options: {
          responsive: true, maintainAspectRatio: true,
          plugins: { legend: { display: false } },
          scales: {
            x: { ticks: { maxTicksLimit: 7 } },
            y: { ticks: { callback: v => fmt(v) } },
          },
        },
      });
    }

    // Post performance bar chart
    const pEl = document.getElementById(`chart-${a.slug}-posts`);
    if (pEl && a.posts?.length) {
      destroyChart(`${a.slug}-posts`);
      const posts = a.posts.slice(0, 10).reverse();
      charts[`${a.slug}-posts`] = new Chart(pEl, {
        type: 'bar',
        data: {
          labels: posts.map(p => fmtDate(p.timestamp)),
          datasets: [
            {
              label: 'Plays',
              data: posts.map(p => p.insights?.plays || p.insights?.reach || 0),
              backgroundColor: color + 'cc',
              borderRadius: 4,
            },
            {
              label: 'Saves',
              data: posts.map(p => p.insights?.saved || 0),
              backgroundColor: '#a855f7cc',
              borderRadius: 4,
            },
          ],
        },
        options: {
          responsive: true, maintainAspectRatio: true,
          plugins: { legend: { labels: { boxWidth: 12 } } },
          scales: { y: { beginAtZero: true, ticks: { callback: v => fmt(v) } } },
        },
      });
    }

    // Daily views + profile visits dual-line chart
    const dEl = document.getElementById(`chart-${a.slug}-daily`);
    if (dEl && a.daily_insights?.length) {
      destroyChart(`${a.slug}-daily`);
      const daily = a.daily_insights;
      charts[`${a.slug}-daily`] = new Chart(dEl, {
        type: 'line',
        data: {
          labels: daily.map(d => fmtDate(d.date)),
          datasets: [
            {
              label: 'Views',
              data: daily.map(d => d.views || 0),
              borderColor: color,
              backgroundColor: color + '18',
              fill: true,
              tension: 0.4,
              pointRadius: 2,
              pointHoverRadius: 6,
              yAxisID: 'y',
            },
            {
              label: 'Profile Visits',
              data: daily.map(d => d.profile_views || 0),
              borderColor: '#f97316',
              backgroundColor: '#f9731618',
              fill: true,
              tension: 0.4,
              pointRadius: 2,
              pointHoverRadius: 6,
              borderDash: [4, 3],
              yAxisID: 'y2',
            },
          ],
        },
        options: {
          responsive: true,
          maintainAspectRatio: true,
          interaction: { mode: 'index', intersect: false },
          plugins: {
            legend: { labels: { boxWidth: 12 } },
            tooltip: {
              callbacks: {
                label: ctx => ` ${ctx.dataset.label}: ${ctx.parsed.y.toLocaleString()}`,
              },
            },
          },
          scales: {
            x: { ticks: { maxTicksLimit: 10 } },
            y: {
              beginAtZero: true,
              position: 'left',
              ticks: { callback: v => fmt(v) },
              title: { display: true, text: 'Views', color: color, font: { size: 11 } },
            },
            y2: {
              beginAtZero: true,
              position: 'right',
              grid: { drawOnChartArea: false },
              ticks: { callback: v => fmt(v) },
              title: { display: true, text: 'Profile Visits', color: '#f97316', font: { size: 11 } },
            },
          },
        },
      });
    }
  });
}

// ── Tab switching ─────────────────────────────────────────────────────────────
let currentTab = 'overview';
function switchTab(slug) {
  currentTab = slug;
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.slug === slug));
  document.querySelectorAll('.panel').forEach(p => p.classList.toggle('active', p.dataset.slug === slug));
}

// ── Main render ───────────────────────────────────────────────────────────────
async function load() {
  const root = document.getElementById('root');
  try {
    const resp = await fetch('data.json?_=' + Date.now());
    if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
    const data = await resp.json();
    const accounts = data.accounts || [];

    // Updated timestamp
    const ts = new Date(data.generated_at);
    document.getElementById('last-updated').textContent =
      'Updated ' + ts.toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' });

    // Build tabs
    let tabsHtml = `<div class="tabs">
      <div class="tab active" data-slug="overview" onclick="switchTab('overview')">📊 Overview</div>`;
    accounts.forEach((a, i) => {
      const emoji = ACCOUNT_EMOJIS[a.slug] || '🐾';
      tabsHtml += `<div class="tab" data-slug="${a.slug}" onclick="switchTab('${a.slug}')">${emoji} @${a.username}</div>`;
    });
    tabsHtml += `</div>`;

    // Build panels
    let panelsHtml = `<div class="panel active" data-slug="overview">${renderOverview(accounts)}</div>`;
    accounts.forEach((a, i) => {
      panelsHtml += `<div class="panel" data-slug="${a.slug}">${renderAccount(a, i)}</div>`;
    });

    root.innerHTML = tabsHtml + panelsHtml;

    // Draw charts for the visible tab
    requestAnimationFrame(() => drawCharts(accounts));

    // Re-draw on tab switch
    document.querySelectorAll('.tab').forEach(t => {
      t.addEventListener('click', () => {
        requestAnimationFrame(() => drawCharts(accounts));
      });
    });

  } catch (err) {
    root.innerHTML = `<div class="error-box">
      <strong>Could not load data.json</strong><br><br>
      ${err.message}<br><br>
      If this is a fresh deploy, run the "Fetch Metrics" GitHub Actions workflow manually first.
    </div>`;
  }
}

load();
</script>
</body>
</html>
